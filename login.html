<!DOCTYPE html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Log Masuk - CHICTRA</title><meta name="theme-color" content="#0b2a4a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="assets/icons/icon-192.png"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><link rel="stylesheet" href="assets/app.css"></head><body class="login-body"><main class="login-wrap"><div class="login-card"><div class="login-brand"><img class="logo-img logo-lg" src="assets/images/logo.png" alt="Logo CHICTRA" width="132" height="132"><h1 class="sr-only">CHICTRA</h1><p>SISTEM NAVIGASI &amp; PEMANTAUAN<br>LADANG AYAM</p></div><div id="login-msg" class="alert alert-warn" hidden role="alert"></div><div id="login-error" class="alert alert-error" hidden role="alert"></div><div id="login-ok" class="alert alert-ok" hidden role="status"></div><form id="login-form" novalidate><label class="field"><span>Username / Email</span><input id="login-user" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label><label class="field"><span>Password</span><input id="login-pass" name="password" type="password" autocomplete="current-password" required></label><button id="login-btn" class="btn btn-primary btn-block btn-lg" type="submit">LOG MASUK</button></form><div id="login-alt" class="login-alt"><span>Belum ada akaun?</span><button type="button" id="show-register" class="btn btn-ghost btn-block">DAFTAR AKAUN BARU (PEGAWAI)</button></div><form id="register-form" novalidate hidden><h2 class="reg-title">Daftar Akaun Pegawai</h2><p class="muted reg-note">Akaun baharu perlu diluluskan oleh admin sebelum boleh log masuk.</p><div id="register-error" class="alert alert-error" hidden role="alert"></div><label class="field"><span>Nama penuh <b class="req">*</b></span><input id="reg-name" type="text" maxlength="120" autocomplete="name"></label><label class="field"><span>Username <b class="req">*</b></span><input id="reg-user" type="text" maxlength="30" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"><div class="field-hint">3-30 aksara: huruf kecil, nombor, titik, sengkang atau garis bawah.</div></label><label class="field"><span>No. telefon</span><input id="reg-phone" type="tel" maxlength="20" autocomplete="tel" placeholder="cth: 012-3456789"></label><label class="field"><span>Password <b class="req">*</b></span><input id="reg-pass" type="password" autocomplete="new-password"><div class="field-hint">Sekurang-kurangnya 8 aksara dengan huruf dan nombor.</div></label><label class="field"><span>Sahkan password <b class="req">*</b></span><input id="reg-pass2" type="password" autocomplete="new-password"></label><button id="register-btn" class="btn btn-green btn-block btn-lg" type="submit">DAFTAR</button><button type="button" id="show-login" class="btn btn-ghost btn-block" style="margin-top:8px">Kembali ke log masuk</button></form></div><footer class="login-footer">Jabatan Perkhidmatan Veterinar</footer></main><div id="offline-banner" class="offline-banner" hidden role="alert">⚠️ TIADA SAMBUNGAN INTERNET</div><script src="config.js"></script><script src="vendor/supabase.js"></script><script type="module" src="assets/login.js"></script></body></html>
